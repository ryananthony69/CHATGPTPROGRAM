name: Aurora Store source inspection

on:
  push:
    branches:
      - evermore-source-probe-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone current Aurora Store source
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://gitlab.com/AuroraOSS/AuroraStore.git /tmp/AuroraStore
          cd /tmp/AuroraStore
          git rev-parse HEAD

      - name: Extract login, download, storage, and installer implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/source-files
          cd /tmp/AuroraStore

          find app/src/main/java -type f \( -iname '*Auth*' -o -iname '*Dispenser*' -o -iname '*Onboard*' -o -iname '*Download*' -o -iname '*Install*' \) \
            -print | sort | tee "$GITHUB_WORKSPACE/artifacts/relevant-file-list.txt"

          grep -RInE --include='*.kt' --include='*.java' \
            'Anonymous|anonymous|dispenser|TokenDispenser|token dispenser|downloadPath|getExternalFilesDir|externalCacheDir|cacheDir|filesDir|DownloadManager|PackageInstaller|installPackage|split.*apk|splitApk|bundle' \
            app/src/main/java \
            | head -n 6000 > "$GITHUB_WORKSPACE/artifacts/relevant-grep.txt" || true

          grep -RInE --include='*.xml' \
            'Anonymous|anonymous|Login|login|Next|Finish|Install|Download|Get started|Terms|Privacy' \
            app/src/main/res \
            | head -n 3000 > "$GITHUB_WORKSPACE/artifacts/relevant-resources.txt" || true

          while IFS= read -r file; do
            [ -f "$file" ] || continue
            safe=$(printf '%s' "$file" | sed 's#/#__#g')
            cp "$file" "$GITHUB_WORKSPACE/artifacts/source-files/$safe"
          done < "$GITHUB_WORKSPACE/artifacts/relevant-file-list.txt"

          find app/src/main/java/com/aurora/store/data -type f -iname '*.kt' -print0 \
            | xargs -0 grep -IlE 'DownloadManager|PackageInstaller|getExternalFilesDir|externalCacheDir|cacheDir|filesDir|split.*apk|bundle' \
            | while IFS= read -r file; do
                safe=$(printf '%s' "$file" | sed 's#/#__#g')
                cp "$file" "$GITHUB_WORKSPACE/artifacts/source-files/$safe"
              done

          find app/src/main/java/com/aurora/store/viewmodel -type f -iname '*.kt' -print0 \
            | xargs -0 grep -IlE 'Anonymous|anonymous|dispenser|token|download|install' \
            | while IFS= read -r file; do
                safe=$(printf '%s' "$file" | sed 's#/#__#g')
                cp "$file" "$GITHUB_WORKSPACE/artifacts/source-files/$safe"
              done

          git rev-parse HEAD > "$GITHUB_WORKSPACE/artifacts/source-commit.txt"
          tar -czf "$GITHUB_WORKSPACE/artifacts/aurora-relevant-source.tar.gz" \
            -C "$GITHUB_WORKSPACE/artifacts" source-files
          du -ah "$GITHUB_WORKSPACE/artifacts" | sort -h | tail -n 30

      - name: Upload source inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-source-inspection
          path: artifacts
          retention-days: 3
