name: Evermore QooApp native emulator

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Evermore direct XAPK Android emulator
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evermore-qooapp-native
  cancel-in-progress: true

jobs:
  open-referral:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe direct Evermore package and pin QooApp
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/evermore-direct artifacts
          PKG='com.evermoregames.evermorearcade'
          UA='QooApp 9.4.0'
          found=no
          urls=(
            "https://api.qoo-app.com/v1/apps/download?id=$PKG"
            "https://api.qoo-app.com/v1/apps/download?id=150473"
            "https://api.qoo-app.com/v6/apps/$PKG/download"
            "https://d.qoo-apk.com/150473/apk/base.apk"
            "https://d.qoo-apk.com/150473/apk/$PKG.apk"
            "https://d.qoo-apk.com/150473/$PKG.apk"
            "https://d.qoo-apk.com/150473/apk/150473.apk"
          )
          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            echo "probe[$i]=$url" | tee -a artifacts/direct-probe.txt
            rm -f /tmp/evermore-direct/candidate.apk
            set +e
            curl --location --fail --retry 2 --retry-all-errors \
              --connect-timeout 20 --max-time 180 -A "$UA" \
              -D "artifacts/direct-probe-$i.headers" \
              "$url" -o /tmp/evermore-direct/candidate.apk
            rc=$?
            set -e
            size=$(stat -f%z /tmp/evermore-direct/candidate.apk 2>/dev/null || echo 0)
            echo "rc=$rc size=$size" | tee -a artifacts/direct-probe.txt
            if [ "$rc" -eq 0 ] && [ "$size" -gt 1000000 ] && \
               [ "$(head -c 2 /tmp/evermore-direct/candidate.apk)" = 'PK' ] && \
               unzip -tq /tmp/evermore-direct/candidate.apk >/dev/null 2>&1; then
              mv /tmp/evermore-direct/candidate.apk /tmp/evermore-direct/Evermore.apk
              printf '%s\n' "$url" | tee artifacts/direct-evermore-source.txt
              shasum -a 256 /tmp/evermore-direct/Evermore.apk | tee artifacts/direct-evermore-sha256.txt
              found=yes
              break
            fi
          done
          echo "direct_package_found=$found" | tee artifacts/direct-evermore-status.txt
          perl -0pi -e 's#https://d\.qoo-apk\.com/QooApp\.apk#https://d.qoo-apk.com/880/apk/com.qooapp.qoohelper-20260708152301.apk#g' .github/evermore/qooapp-native-run.sh
          python3 .github/evermore/patch-direct-apk.py

      - name: Run QooApp Android emulator controller
        shell: bash
        run: bash .github/evermore/qooapp-native-run.sh

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evermore-qooapp-native-proof
          path: artifacts
          if-no-files-found: warn
          retention-days: 3
