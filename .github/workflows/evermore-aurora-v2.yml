name: Evermore direct XAPK Android emulator

on:
  push:
    branches:
      - evermore-aurora-v2-20260806
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evermore-direct-xapk-ubuntu
  cancel-in-progress: true

jobs:
  open-referral:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PKG: com.evermoregames.evermorearcade
      REFERRAL_URI: evermorearcade://referral?code=J32R6Q
      REFERRAL_PAGE: https://evermoregamesllc.com/referral?code=J32R6Q
      APKCOMBO_PAGE: https://apkcombo.com/evermore-arcade-win-cash/com.evermoregames.evermorearcade/download/apk
      XAPK_URL: https://ztp-pew.apkcombo.com/xapk/com.evermoregames.evermorearcade/15c2243bf1a64f66ab786783b298256a/download?name=com.evermoregames.evermorearcade_0.1.64.xapk

    steps:
      - name: Enable KVM and download Evermore XAPK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts /tmp/evermore-unpacked
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm | tee artifacts/kvm.txt

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36'
          XAPK=/tmp/Evermore.xapk
          echo '=== Direct XAPK headers ===' | tee artifacts/xapk-download.txt
          curl --silent --show-error --location --head \
            --connect-timeout 30 --max-time 120 \
            -A "$UA" -e "$APKCOMBO_PAGE" "$XAPK_URL" \
            | tee -a artifacts/xapk-download.txt || true

          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --max-time 2400 \
            -A "$UA" -e "$APKCOMBO_PAGE" \
            -D artifacts/xapk-response-headers.txt \
            "$XAPK_URL" -o "$XAPK"

          test "$(head -c 2 "$XAPK")" = 'PK'
          unzip -tq "$XAPK" >/dev/null
          ls -lh "$XAPK" | tee -a artifacts/xapk-download.txt
          sha256sum "$XAPK" | tee artifacts/xapk-sha256.txt
          unzip -q "$XAPK" -d /tmp/evermore-unpacked
          find /tmp/evermore-unpacked -type f -printf '%s %p\n' | sort -n \
            | tee artifacts/xapk-files.txt

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('/tmp/evermore-unpacked')
          apks = sorted(root.rglob('*.apk'))
          if not apks:
              raise SystemExit('XAPK contained no APK files')
          Path('/tmp/apk-list.txt').write_text('\n'.join(str(p) for p in apks) + '\n')
          manifest = {
              'apk_count': len(apks),
              'apks': [{'path': str(p), 'size': p.stat().st_size} for p in apks],
              'obb': [str(p) for p in sorted(root.rglob('*.obb'))],
          }
          Path('artifacts/unpacked-manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
          cp /tmp/apk-list.txt artifacts/apk-list.txt

      - name: Write Android test controller
        shell: bash
        run: |
          cat > /tmp/run-evermore-direct.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mkdir -p artifacts
          exec > >(tee artifacts/controller.log) 2>&1

          snap() {
            local name="$1"
            adb exec-out screencap -p > "artifacts/${name}.png" || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "artifacts/${name}.xml" >/dev/null 2>&1 || true
          }
          top_activity() {
            adb shell dumpsys activity activities 2>/dev/null | \
              sed -n 's/.*mResumedActivity:.* \([^ ]*\) .*/\1/p' | head -n1 | tr -d '\r'
          }

          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do sleep 2; done
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global package_verifier_enable 0 || true
          adb shell settings put global verifier_verify_adb_installs 0 || true
          adb shell svc wifi enable || true
          adb shell svc data enable || true
          adb devices -l | tee artifacts/adb-devices.txt
          adb shell getprop > artifacts/getprop.txt
          adb shell getprop ro.product.cpu.abilist | tee artifacts/abilist.txt
          adb shell getprop ro.dalvik.vm.native.bridge | tee artifacts/native-bridge.txt

          mapfile -t APKS < /tmp/apk-list.txt
          echo "Installing ${#APKS[@]} APK files"
          printf '%s\n' "${APKS[@]}" | tee artifacts/install-apks.txt
          set +e
          adb install-multiple -r -t -g "${APKS[@]}" 2>&1 | tee artifacts/install-result.txt
          install_rc=${PIPESTATUS[0]}
          set -e
          echo "install_rc=$install_rc" | tee artifacts/install-status.txt

          while IFS= read -r obb; do
            [ -n "$obb" ] || continue
            adb shell mkdir -p "/sdcard/Android/obb/$PKG"
            adb push "$obb" "/sdcard/Android/obb/$PKG/"
          done < <(find /tmp/evermore-unpacked -type f -iname '*.obb' -print)

          installed=no
          if adb shell pm path "$PKG" 2>/dev/null | grep -q '^package:'; then
            installed=yes
            adb shell pm path "$PKG" | tee artifacts/package-paths.txt
            adb shell dumpsys package "$PKG" > artifacts/package.txt

            adb logcat -c || true
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 \
              2>&1 | tee artifacts/first-launch.txt || true
            sleep 15
            snap 01-first-launch-15s
            sleep 30
            snap 02-first-launch-45s

            adb shell am force-stop "$PKG" || true
            set +e
            adb shell am start -W -a android.intent.action.VIEW \
              -c android.intent.category.BROWSABLE \
              -d "$REFERRAL_URI" -p "$PKG" \
              2>&1 | tee artifacts/custom-referral-launch.txt
            custom_rc=${PIPESTATUS[0]}
            set -e
            sleep 12
            snap 03-custom-referral-12s
            sleep 30
            snap 04-custom-referral-42s

            set +e
            adb shell am start -W -a android.intent.action.VIEW \
              -c android.intent.category.BROWSABLE \
              -d "$REFERRAL_PAGE" -p "$PKG" \
              2>&1 | tee artifacts/https-referral-launch.txt
            https_rc=${PIPESTATUS[0]}
            set -e
            sleep 12
            snap 05-https-referral-12s
          else
            custom_rc=-1
            https_rc=-1
          fi

          adb shell cmd package query-activities -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE -d "$REFERRAL_URI" \
            > artifacts/custom-referral-handlers.txt 2>&1 || true
          adb shell cmd package query-activities -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE -d "$REFERRAL_PAGE" \
            > artifacts/https-referral-handlers.txt 2>&1 || true
          adb shell dumpsys activity activities > artifacts/activities.txt || true
          adb shell dumpsys window windows > artifacts/windows.txt || true
          adb logcat -d -v threadtime > artifacts/logcat.txt || true

          {
            echo "installed=$installed"
            echo "package=$PKG"
            echo "referral_uri=$REFERRAL_URI"
            echo "custom_launch_rc=$custom_rc"
            echo "https_launch_rc=$https_rc"
            echo "top_activity=$(top_activity)"
            echo "android=$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "abilist=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
            echo "native_bridge=$(adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')"
          } | tee artifacts/RESULT.txt

          test "$installed" = yes
          SH
          chmod +x /tmp/run-evermore-direct.sh

      - name: Boot Android, install XAPK, and open referral
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          heap-size: 768M
          disk-size: 16384M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: /tmp/run-evermore-direct.sh

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evermore-direct-xapk-ubuntu-proof
          path: artifacts
          if-no-files-found: warn
          retention-days: 3
