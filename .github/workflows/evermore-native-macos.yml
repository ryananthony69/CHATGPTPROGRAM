name: Evermore native macOS Android emulator

on:
  push:
    branches:
      - evermore-native-macos-20260806
  workflow_dispatch:

permissions:
  contents: write

jobs:
  open-referral:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EVERMORE_PKG: com.evermoregames.evermorearcade
      AURORA_PKG: com.aurora.store
      REFERRAL_PAGE: https://evermoregamesllc.com/referral?code=J32R6Q
      REFERRAL_URI: evermorearcade://referral?code=J32R6Q
      AURORA_APK: https://f-droid.org/repo/com.aurora.store_75.apk

    steps:
      - name: Build a native ARM64 Android runtime from official archives
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts /tmp/android-runtime /tmp/aurora-cache
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT"
          printf 'host=%s\narch=%s\n' "$(sw_vers -productVersion)" "$(uname -m)" \
            | tee artifacts/host.txt

          python3 - <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'AndroidSDKManager/1.0'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return response.read().decode('utf-8', 'replace')

          repository = get('https://dl.google.com/android/repository/repository2-3.xml')
          system_images = get('https://dl.google.com/android/repository/sys-img/google_apis/sys-img2-3.xml')

          emulators = [(int(build), name) for name, build in re.findall(
              r'<url>(emulator-darwin_aarch64-(\d+)\.zip)</url>', repository)]
          if not emulators:
              raise SystemExit('No macOS ARM64 emulator archive was found in Google repository metadata.')
          _, emulator_name = max(emulators)

          images = [(int(api), int(revision), name) for name, api, revision in re.findall(
              r'<url>(arm64-v8a-(\d+)_r(\d+)\.zip)</url>', system_images)]
          compatible = [item for item in images if item[0] <= 35]
          if not compatible:
              raise SystemExit('No compatible Google APIs ARM64 system image was found.')
          api, _, image_name = max(compatible)

          values = {
              'ANDROID_API': str(api),
              'EMULATOR_URL': 'https://dl.google.com/android/repository/' + emulator_name,
              'SYSTEM_IMAGE_URL': 'https://dl.google.com/android/repository/sys-img/google_apis/' + image_name,
              'PLATFORM_TOOLS_URL': 'https://dl.google.com/android/repository/platform-tools-latest-darwin.zip',
          }
          Path('/tmp/android-runtime/runtime.env').write_text(
              ''.join(f'{key}={value}\n' for key, value in values.items()))
          print(values)
          PY
          source /tmp/android-runtime/runtime.env
          cat /tmp/android-runtime/runtime.env | tee artifacts/runtime-urls.txt

          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --max-time 900 "$EMULATOR_URL" \
            -o /tmp/android-runtime/emulator.zip
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --max-time 600 "$PLATFORM_TOOLS_URL" \
            -o /tmp/android-runtime/platform-tools.zip
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --max-time 1200 "$SYSTEM_IMAGE_URL" \
            -o /tmp/android-runtime/system-image.zip
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --max-time 600 "$AURORA_APK" \
            -o /tmp/android-runtime/AuroraStore.apk

          for archive in /tmp/android-runtime/*.zip /tmp/android-runtime/AuroraStore.apk; do
            test "$(head -c 2 "$archive")" = 'PK'
            unzip -tq "$archive" >/dev/null
          done
          shasum -a 256 /tmp/android-runtime/*.zip /tmp/android-runtime/AuroraStore.apk \
            | tee artifacts/download-sha256.txt
          du -h /tmp/android-runtime/*.zip /tmp/android-runtime/AuroraStore.apk \
            | tee artifacts/download-sizes.txt

          unzip -q /tmp/android-runtime/emulator.zip -d "$ANDROID_SDK_ROOT"
          unzip -q /tmp/android-runtime/platform-tools.zip -d "$ANDROID_SDK_ROOT"
          IMAGE_PARENT="$ANDROID_SDK_ROOT/system-images/android-$ANDROID_API/google_apis"
          mkdir -p "$IMAGE_PARENT"
          unzip -q /tmp/android-runtime/system-image.zip -d "$IMAGE_PARENT"
          IMAGE_DIR=$(find "$IMAGE_PARENT" -type f -name system.img -print -quit | xargs dirname)
          test -n "$IMAGE_DIR"
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_API=%s\nIMAGE_DIR=%s\n' \
            "$ANDROID_SDK_ROOT" "$ANDROID_API" "$IMAGE_DIR" \
            | tee /tmp/android-runtime/paths.env artifacts/runtime-paths.txt
          find "$ANDROID_SDK_ROOT/emulator" -maxdepth 2 -type f -print \
            | head -n 100 > artifacts/emulator-files.txt
          find "$IMAGE_DIR" -maxdepth 1 -type f -print \
            | sort > artifacts/system-image-files.txt
          chmod +x "$ANDROID_SDK_ROOT/emulator/emulator" "$ANDROID_SDK_ROOT/platform-tools/adb"

      - name: Create and boot the native Android emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/android-runtime/paths.env
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          AVD="$HOME/.android/avd/evermore.avd"
          mkdir -p "$AVD"
          cat > "$HOME/.android/avd/evermore.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD
          path.rel=avd/evermore.avd
          target=android-$ANDROID_API
          EOF
          cat > "$AVD/config.ini" <<EOF
          AvdId=evermore
          PlayStore.enabled=false
          abi.type=arm64-v8a
          avd.ini.displayname=Evermore Native ARM64
          avd.ini.encoding=UTF-8
          disk.dataPartition.size=8G
          fastboot.forceColdBoot=yes
          fastboot.forceFastBoot=no
          hw.accelerometer=yes
          hw.audioInput=no
          hw.battery=yes
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=arm64
          hw.cpu.ncore=4
          hw.gps=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=auto
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=2400
          hw.lcd.width=1080
          hw.mainKeys=no
          hw.ramSize=4096
          image.sysdir.1=$IMAGE_DIR/
          runtime.network.latency=none
          runtime.network.speed=full
          sdcard.size=512M
          showDeviceFrame=no
          skin.dynamic=yes
          skin.name=1080x2400
          skin.path=_no_skin
          tag.display=Google APIs
          tag.id=google_apis
          vm.heapSize=512
          EOF

          "$ANDROID_SDK_ROOT/emulator/emulator" -version | tee artifacts/emulator-version.txt
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | tee artifacts/avd-list.txt
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" @evermore \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio \
            -no-boot-anim -camera-back none -camera-front none \
            -memory 4096 -cores 4 -netdelay none -netspeed full \
            > artifacts/emulator.log 2>&1 &
          echo $! | tee artifacts/emulator.pid

          ready=no
          for i in $(seq 1 240); do
            if adb get-state >/dev/null 2>&1; then ready=yes; break; fi
            sleep 3
          done
          test "$ready" = yes
          booted=no
          for i in $(seq 1 240); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              booted=yes
              break
            fi
            sleep 3
          done
          test "$booted" = yes
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global package_verifier_enable 0 || true
          adb shell settings put global verifier_verify_adb_installs 0 || true
          adb shell svc wifi enable || true
          adb shell svc data enable || true
          adb devices -l | tee artifacts/adb-devices.txt
          adb shell getprop > artifacts/getprop.txt
          adb shell getprop ro.product.cpu.abilist | tee artifacts/abilist.txt
          adb shell getprop ro.dalvik.vm.native.bridge | tee artifacts/native-bridge.txt
          adb shell wm size | tee artifacts/display-size.txt

      - name: Install through Aurora, launch Evermore, and open exact referral URI
        shell: bash
        run: |
          set -Eeuo pipefail
          source /tmp/android-runtime/paths.env
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          exec > >(tee artifacts/controller.log) 2>&1

          snap() {
            local name="$1"
            adb exec-out screencap -p > "artifacts/${name}.png" || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "artifacts/${name}.xml" >/dev/null 2>&1 || true
          }
          installed() {
            adb shell pm path "$EVERMORE_PKG" 2>/dev/null | grep -q '^package:'
          }

          cat > /tmp/ui.py <<'PY'
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          def adb(*args):
              return subprocess.run(['adb', *args], stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT, text=True,
                                    timeout=40).stdout

          adb('shell', 'uiautomator', 'dump', '/sdcard/window.xml')
          adb('pull', '/sdcard/window.xml', '/tmp/window.xml')
          root = ET.parse('/tmp/window.xml').getroot()
          nodes = []
          for element in root.iter('node'):
              a = element.attrib
              match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', a.get('bounds', ''))
              if not match:
                  continue
              x1, y1, x2, y2 = map(int, match.groups())
              nodes.append({
                  'values': [a.get('text', ''), a.get('content-desc', ''), a.get('resource-id', '')],
                  'clickable': a.get('clickable') == 'true',
                  'enabled': a.get('enabled') != 'false',
                  'class': a.get('class', ''),
                  'checked': a.get('checked') == 'true',
                  'x': (x1 + x2) // 2,
                  'y': (y1 + y2) // 2,
                  'bounds': a.get('bounds', ''),
              })

          command = sys.argv[1]
          if command == 'dump':
              print(' | '.join(value for node in nodes for value in node['values'][:2] if value))
              raise SystemExit(0)

          pattern = re.compile(sys.argv[2], re.I)
          exact = command == 'tap-exact'
          candidates = []
          for node in nodes:
              if not node['enabled']:
                  continue
              matched = any((pattern.fullmatch(value) if exact else pattern.search(value))
                            for value in node['values'] if value)
              if matched:
                  candidates.append(node)
          if not candidates:
              raise SystemExit(1)
          candidates.sort(key=lambda node: (0 if node['clickable'] else 1, node['y']))
          chosen = candidates[0]
          adb('shell', 'input', 'tap', str(chosen['x']), str(chosen['y']))
          print(chosen)
          PY
          ui() { python3 /tmp/ui.py "$@"; }

          adb install -r -g /tmp/android-runtime/AuroraStore.apk | tee artifacts/aurora-install.txt
          adb shell appops set "$AURORA_PKG" REQUEST_INSTALL_PACKAGES allow || true
          adb shell appops set "$AURORA_PKG" MANAGE_EXTERNAL_STORAGE allow || true
          adb shell appops set "$AURORA_PKG" RUN_IN_BACKGROUND allow || true
          adb shell appops set "$AURORA_PKG" RUN_ANY_IN_BACKGROUND allow || true
          adb shell dumpsys deviceidle whitelist +"$AURORA_PKG" || true

          adb shell monkey -p "$AURORA_PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 7
          snap 01-aurora-welcome
          for i in $(seq 1 30); do
            screen=$(ui dump 2>/dev/null || true)
            echo "onboarding[$i] $screen"
            if printf '%s' "$screen" | grep -qi 'Anonymous'; then break; fi
            ui tap-exact '^Skip$' || ui tap-exact '^Next$' || ui tap-exact '^Finish$' || \
              ui tap 'Continue|Accept|Agree|OK' || true
            sleep 3
          done
          snap 02-aurora-login
          ui tap-exact '^Anonymous$' || adb shell input tap 540 1985
          sleep 12

          login=no
          for i in $(seq 1 75); do
            screen=$(ui dump 2>/dev/null || true)
            echo "login[$i] $screen"
            if printf '%s' "$screen" | grep -Eqi 'Apps.*Games|Games.*Apps|For you|Top charts|Categories|Updates'; then
              login=yes
              break
            fi
            ui tap 'Continue|Proceed|Accept|Agree|OK|Retry|Try again' || true
            if printf '%s' "$screen" | grep -qi 'Anonymous'; then
              ui tap-exact '^Anonymous$' || adb shell input tap 540 1985
            fi
            if (( i % 10 == 0 )); then snap "aurora-login-${i}"; fi
            sleep 4
          done
          echo "anonymous_login=$login" | tee artifacts/login-status.txt
          snap 03-aurora-after-login

          if [ "$login" = yes ]; then
            adb shell am start -W -a android.intent.action.VIEW \
              -d "market://details?id=$EVERMORE_PKG" -p "$AURORA_PKG" \
              | tee artifacts/aurora-evermore-deeplink.txt || true
            sleep 15
            snap 04-evermore-listing

            for i in $(seq 1 180); do
              if installed; then break; fi
              screen=$(ui dump 2>/dev/null || true)
              echo "install[$i] $screen"
              ui tap-exact '^Install$' || ui tap-exact '^Download$' || ui tap-exact '^Get$' || \
                ui tap 'Install anyway|Continue|Allow from this source|Allow|OK|Done|Retry|Try again' || true
              if (( i % 12 == 0 )); then snap "install-progress-${i}"; fi
              sleep 4
            done
          fi

          if ! installed; then
            echo '=== Aurora private-cache installation fallback ==='
            adb root || true
            adb wait-for-device
            for i in $(seq 1 120); do
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
              sleep 2
            done
            adb shell find /data/user/0/com.aurora.store/cache/Downloads -type f \
              2>/dev/null | tee artifacts/aurora-private-files.txt || true
            adb pull /data/user/0/com.aurora.store/cache/Downloads /tmp/aurora-cache \
              > artifacts/aurora-private-pull.txt 2>&1 || true
            python3 - <<'PY' | tee artifacts/private-install.txt
          import subprocess
          from pathlib import Path
          files = sorted(str(path) for path in Path('/tmp/aurora-cache').rglob('*.apk'))
          print('APK files:', *files, sep='\n')
          if files:
              process = subprocess.run(['adb', 'install-multiple', '-r', '-t', '-g', *files],
                                       stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(process.stdout)
              raise SystemExit(process.returncode)
          PY
          fi

          INSTALLED=no
          if installed; then
            INSTALLED=yes
            adb logcat -c || true
            adb shell monkey -p "$EVERMORE_PKG" -c android.intent.category.LAUNCHER 1 \
              | tee artifacts/evermore-first-launch.txt || true
            sleep 20
            snap 05-evermore-first-launch-20s
            sleep 30
            snap 06-evermore-first-launch-50s

            adb shell am force-stop "$EVERMORE_PKG" || true
            adb shell am start -W -a android.intent.action.VIEW \
              -c android.intent.category.BROWSABLE -d "$REFERRAL_URI" -p "$EVERMORE_PKG" \
              | tee artifacts/custom-referral-launch.txt || true
            sleep 15
            snap 07-custom-referral-15s
            sleep 30
            snap 08-custom-referral-45s

            adb shell am start -W -a android.intent.action.VIEW \
              -c android.intent.category.BROWSABLE -d "$REFERRAL_PAGE" -p "$EVERMORE_PKG" \
              | tee artifacts/https-referral-launch.txt || true
            sleep 12
            snap 09-https-referral-12s
          fi

          adb shell pm path "$EVERMORE_PKG" | tee artifacts/evermore-package-paths.txt || true
          adb shell dumpsys package "$EVERMORE_PKG" > artifacts/evermore-package.txt || true
          adb shell cmd package query-activities -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE -d "$REFERRAL_URI" \
            > artifacts/custom-referral-handlers.txt 2>&1 || true
          adb shell dumpsys activity activities > artifacts/activities.txt || true
          adb shell dumpsys window windows > artifacts/windows.txt || true
          adb logcat -d -v threadtime > artifacts/logcat.txt || true
          TOP=$(adb shell dumpsys activity activities | sed -n \
            's/.*mResumedActivity:.* \([^ ]*\) .*/\1/p' | head -n1 | tr -d '\r')
          {
            echo "installed=$INSTALLED"
            echo "package=$EVERMORE_PKG"
            echo "referral_uri=$REFERRAL_URI"
            echo "top_activity=$TOP"
            echo "android=$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "abilist=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
          } | tee artifacts/RESULT.txt
          test "$INSTALLED" = yes

      - name: Publish proof package without marketplace actions
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path('artifacts')
          output = Path('/tmp/evermore-native-macos-proof.zip')
          with ZipFile(output, 'w', ZIP_DEFLATED, allowZip64=True) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root.parent).as_posix())
          print(f'proof_size={output.stat().st_size}')
          PY

          TAG="evermore-native-macos-${GITHUB_RUN_ID}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          python3 - <<PY > /tmp/release.json
          import json
          print(json.dumps({
              'tag_name': '${TAG}',
              'target_commitish': '${GITHUB_SHA}',
              'name': 'Evermore native macOS emulator proof ${GITHUB_RUN_ID}',
              'body': 'Native Apple-silicon Android emulator run for Evermore referral J32R6Q.',
              'draft': True,
              'prerelease': True,
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/releases" --data-binary @/tmp/release.json \
            | tee /tmp/release-response.json
          UPLOAD=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/release-response.json'))['upload_url'].split('{', 1)[0])
          PY
          )
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/zip' \
            --data-binary @/tmp/evermore-native-macos-proof.zip \
            "${UPLOAD}?name=evermore-native-macos-proof.zip" \
            | tee /tmp/asset-response.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/asset-response.json'))
          print('asset_id=' + str(data['id']))
          print('asset_size=' + str(data['size']))
          print('browser_download_url=' + data['browser_download_url'])
          PY
