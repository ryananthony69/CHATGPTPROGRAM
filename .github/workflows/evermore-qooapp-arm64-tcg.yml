name: Evermore QooApp ARM64 TCG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evermore-qooapp-arm64-tcg.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evermore-qooapp-arm64-tcg
  cancel-in-progress: true

jobs:
  open-referral:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      QOOAPP_APK_URL: https://d.qoo-apk.com/880/apk/com.qooapp.qoohelper-20260708152301.apk
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download current QooApp 9.4
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts /tmp/qooapp
          printf 'host=%s\narch=%s\n' "$(uname -sr)" "$(uname -m)" | tee artifacts/host.txt
          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "$QOOAPP_APK_URL" -o /tmp/qooapp/QooApp.apk
          test "$(head -c 2 /tmp/qooapp/QooApp.apk)" = 'PK'
          unzip -tq /tmp/qooapp/QooApp.apk >/dev/null
          sha256sum /tmp/qooapp/QooApp.apk | tee artifacts/qooapp-sha256.txt
          ls -lh /tmp/qooapp/QooApp.apk | tee artifacts/qooapp-size.txt

      - name: Boot ARM64 Android 12 with software CPU emulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          disk-size: 8192M
          emulator-boot-timeout: 1500
          disable-linux-hw-accel: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/evermore/qooapp-ubuntu-fast.sh

      - name: Upload TCG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evermore-qooapp-arm64-tcg-proof
          path: artifacts
          if-no-files-found: warn
          retention-days: 3
