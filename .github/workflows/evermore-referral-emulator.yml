name: Evermore referral Android emulator

on:
  push:
    branches:
      - evermore-emulator-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-referral:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PKG: com.evermoregames.evermorearcade
      REFERRAL_URL: https://evermoregamesllc.com/referral?code=J32R6Q

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download Evermore through QooApp mobile API
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts /tmp/evermore-apks
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import secrets
          import sys
          import time
          from urllib.parse import urlparse

          import requests

          PKG = os.environ['PKG']
          OUT = pathlib.Path('/tmp/evermore-apks')
          ART = pathlib.Path('artifacts')
          OUT.mkdir(parents=True, exist_ok=True)
          ART.mkdir(parents=True, exist_ok=True)

          device_id = secrets.token_hex(8)
          session = requests.Session()
          session.headers.update({'Accept-Encoding': 'gzip', 'Device-Id': device_id})

          clients = [
              ('9.3.0', 90300),
              ('9.1.1', 90101),
              ('9.0.0', 90000),
              ('8.1.7', 317),
              ('8.1.6', 316),
          ]
          common = {
              'supported_abis': 'arm64-v8a,armeabi-v7a',
              'sdk_version': '31',
              'locale': 'en',
              'system_locale': 'en_US',
              'device': 'oriole',
              'device_model': 'Pixel 6',
              'screen': '1080,2400',
              'density': '420',
              'opengl': '196610',
              'rooted': 'false',
          }

          chosen = None
          diagnostics = []
          info_payload = None
          token = None

          for version_name, version_code in clients:
              ua = f'QooApp {version_name}'
              session.headers['User-Agent'] = ua
              try:
                  token_response = session.post(
                      'https://api.qoo-app.com/v6/users',
                      params={'version_code': version_code},
                      data={
                          'device_id': device_id,
                          'platform_access_token': device_id,
                          'type': 4,
                          'email': 'null',
                          'version_code': version_code,
                      },
                      timeout=45,
                  )
                  token_json = token_response.json() if token_response.content else {}
                  candidate_token = token_json.get('token')
                  diagnostics.append({
                      'client': version_name,
                      'version_code': version_code,
                      'token_status': token_response.status_code,
                      'token_received': bool(candidate_token),
                  })
                  if not candidate_token:
                      continue

                  info_headers = {'X-User-Token': candidate_token}
                  info_params = dict(common)
                  info_params['version_code'] = version_code
                  info_response = session.get(
                      f'https://api.qoo-app.com/v10/apps/{PKG}',
                      params=info_params,
                      headers=info_headers,
                      timeout=60,
                  )
                  try:
                      candidate_info = info_response.json()
                  except Exception:
                      candidate_info = {'raw': info_response.text[:2000]}
                  diagnostics[-1].update({
                      'info_status': info_response.status_code,
                      'info_has_data': bool(candidate_info.get('data')),
                  })
                  if info_response.ok and candidate_info.get('data'):
                      chosen = (version_name, version_code)
                      token = candidate_token
                      info_payload = candidate_info
                      break
              except Exception as exc:
                  diagnostics.append({
                      'client': version_name,
                      'version_code': version_code,
                      'error': f'{type(exc).__name__}: {exc}',
                  })

          ART.joinpath('qooapp-client-attempts.json').write_text(json.dumps(diagnostics, indent=2))
          if not chosen or not token or not info_payload:
              raise SystemExit('QooApp mobile API did not return Evermore metadata')

          version_name, version_code = chosen
          data = info_payload['data']
          ART.joinpath('qooapp-info.json').write_text(json.dumps(info_payload, indent=2))
          summary = {
              'qooapp_client': version_name,
              'qooapp_client_code': version_code,
              'id': data.get('id'),
              'package_id': data.get('package_id'),
              'display_name': data.get('display_name') or data.get('app_name'),
              'is_apk_ready': data.get('is_apk_ready'),
              'apk': data.get('apk'),
          }
          ART.joinpath('qooapp-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))

          if data.get('package_id') not in (None, PKG):
              raise SystemExit(f'Unexpected package returned: {data.get("package_id")}')
          if data.get('is_apk_ready') is False:
              raise SystemExit('QooApp reports the Evermore APK is not ready')

          session.headers['User-Agent'] = f'QooApp {version_name}'
          auth_headers = {'X-User-Token': token}

          def download(url, destination, *, params=None, headers=None):
              destination = pathlib.Path(destination)
              temp = destination.with_suffix(destination.suffix + '.part')
              with session.get(url, params=params, headers=headers or {}, stream=True,
                               allow_redirects=True, timeout=(45, 1800)) as response:
                  response.raise_for_status()
                  meta = {
                      'requested_url': url,
                      'final_url': response.url,
                      'status': response.status_code,
                      'content_type': response.headers.get('content-type'),
                      'content_length': response.headers.get('content-length'),
                      'content_disposition': response.headers.get('content-disposition'),
                  }
                  with temp.open('wb') as output:
                      for chunk in response.iter_content(1024 * 1024):
                          if chunk:
                              output.write(chunk)
              temp.replace(destination)
              return meta

          download_params = dict(common)
          download_params.update({
              'version_code': version_code,
              'version_name': version_name,
              'base_apk_version': 0,
              'base_apk_md5': 'null',
              'type': 'app',
              'package_id': 'com.qooapp.qoohelper',
              'os': 'android 12',
              'device_id': device_id,
              'android_id': device_id,
          })
          base_meta = download(
              f'https://api.qoo-app.com/v6/apps/{PKG}/download',
              OUT / 'base.apk',
              params=download_params,
              headers=auth_headers,
          )
          ART.joinpath('qooapp-base-response.json').write_text(json.dumps(base_meta, indent=2))

          # QooApp metadata exposes split-package URLs when an app bundle is used.
          # Collect only URLs found inside fields whose path identifies an APK/download/split.
          candidates = []
          def walk(value, path=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      walk(child, path + (str(key),))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, path + (str(index),))
              elif isinstance(value, str) and value.startswith(('http://', 'https://')):
                  joined = '.'.join(path).lower()
                  lower = value.lower()
                  if ('split' in joined or 'apk' in joined or 'download' in joined or
                      lower.endswith('.apk') or 'qoo-apk.com' in lower):
                      candidates.append((joined, value))
          walk(data)

          base_final = base_meta.get('final_url', '')
          seen = {base_final}
          split_meta = []
          split_index = 0
          for path, url in candidates:
              if url in seen:
                  continue
              seen.add(url)
              # Exclude ordinary artwork and web links even if an ancestor happened to say APK.
              lower = url.lower()
              if any(token in lower for token in ('.png', '.jpg', '.jpeg', '.webp', '.gif')):
                  continue
              split_index += 1
              destination = OUT / f'split-{split_index:03d}.apk'
              try:
                  meta = download(url, destination, headers=auth_headers)
                  meta['metadata_path'] = path
                  split_meta.append(meta)
              except Exception as exc:
                  split_meta.append({'url': url, 'metadata_path': path, 'error': f'{type(exc).__name__}: {exc}'})
          ART.joinpath('qooapp-split-responses.json').write_text(json.dumps(split_meta, indent=2))

          # Keep only real ZIP/APK files. Save unexpected responses for diagnosis.
          valid = []
          invalid = []
          for path in sorted(OUT.glob('*.apk')):
              head = path.read_bytes()[:4]
              if head[:2] == b'PK':
                  valid.append(path)
              else:
                  invalid.append({'name': path.name, 'size': path.stat().st_size, 'head_hex': head.hex()})
                  path.rename(path.with_suffix(path.suffix + '.invalid'))
          ART.joinpath('invalid-downloads.json').write_text(json.dumps(invalid, indent=2))
          if not valid:
              raise SystemExit('QooApp returned no valid APK files')

          manifest = []
          for path in valid:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              manifest.append({'name': path.name, 'size': path.stat().st_size, 'sha256': digest})
          ART.joinpath('apk-manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY

          find /tmp/evermore-apks -maxdepth 1 -type f -printf '%s %f\n' | sort -n | tee artifacts/downloaded-files.txt

      - name: Write emulator test script
        shell: bash
        run: |
          cat > run-evermore.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mkdir -p artifacts
          exec > >(tee artifacts/runner.log) 2>&1

          snapshot() {
            local name="$1"
            adb exec-out screencap -p > "artifacts/${name}.png" || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "artifacts/${name}.xml" >/dev/null 2>&1 || true
          }

          echo '=== Emulator identity ==='
          adb wait-for-device
          adb shell getprop > artifacts/getprop.txt
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abilist
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc wifi enable || true
          adb shell svc data enable || true

          mapfile -d '' APKS < <(find /tmp/evermore-apks -maxdepth 1 -type f -iname '*.apk' -print0)
          echo "Installing ${#APKS[@]} APK file(s)"
          printf '%s\n' "${APKS[@]}" | tee artifacts/install-file-list.txt
          adb install-multiple -r -t -g "${APKS[@]}" | tee artifacts/install.txt

          echo '=== Package verification ==='
          adb shell pm path "$PKG" | tee artifacts/package-paths.txt
          adb shell dumpsys package "$PKG" > artifacts/package-dump.txt
          adb shell cmd package query-activities -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$REFERRAL_URL" > artifacts/deep-link-handlers-before.txt 2>&1 || true

          echo '=== First launch ==='
          adb logcat -c || true
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 | tee artifacts/first-launch.txt || true
          sleep 15
          snapshot 01-first-launch

          echo '=== Opening referral as an app-scoped deep link ==='
          adb shell am force-stop "$PKG" || true
          adb shell am start -W -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE \
            -d "$REFERRAL_URL" -p "$PKG" | tee artifacts/deep-link-app-scoped.txt || true
          sleep 10
          snapshot 02-referral-10s
          sleep 25
          snapshot 03-referral-35s

          echo '=== Opening referral through Android resolver as fallback ==='
          adb shell am start -W -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE \
            -d "$REFERRAL_URL" | tee artifacts/deep-link-generic.txt || true
          sleep 12
          snapshot 04-referral-generic

          adb shell dumpsys activity activities > artifacts/activities.txt || true
          adb shell dumpsys window windows > artifacts/windows.txt || true
          adb shell cmd package query-activities -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$REFERRAL_URL" > artifacts/deep-link-handlers-after.txt 2>&1 || true
          adb logcat -d -v threadtime > artifacts/logcat.txt || true

          TOP=$(adb shell dumpsys activity activities | sed -n 's/.*mResumedActivity:.* \([^ ]*\) .*/\1/p' | head -n1 | tr -d '\r')
          {
            echo "package=$PKG"
            echo "referral=$REFERRAL_URL"
            echo "installed=yes"
            echo "top_activity=$TOP"
            echo "android=$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "abilist=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
          } | tee artifacts/RESULT.txt
          SH
          chmod +x run-evermore.sh

      - name: Boot Android 12, install Evermore, and open referral
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          heap-size: 768M
          disk-size: 12288M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash run-evermore.sh

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evermore-referral-proof
          path: artifacts
          if-no-files-found: warn
          retention-days: 3
