name: Evermore referral Android emulator

on:
  push:
    branches:
      - evermore-emulator-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-referral:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PKG: com.evermoregames.evermorearcade
      REFERRAL_URL: https://evermoregamesllc.com/referral?code=J32R6Q
      QOOAPP_ID: '150473'

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Resolve Evermore package from QooApp
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts /tmp/evermore-apks
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36'

          curl --silent --show-error --location --compressed \
            --connect-timeout 30 --max-time 120 \
            -A "$UA" \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://qoopy.leadrdrk.com' \
            -H 'Referer: https://qoopy.leadrdrk.com/' \
            --data "{\"id\":\"$QOOAPP_ID\"}" \
            -D artifacts/qoopy-headers.txt \
            https://qoopy.leadrdrk.com/api/v2/app \
            -o artifacts/qoopy-response.json

          python3 - <<'PY'
          import json, pathlib, sys
          source = pathlib.Path('artifacts/qoopy-response.json')
          try:
              payload = json.loads(source.read_text())
          except Exception as exc:
              print(f'Qoopy did not return JSON: {exc}', file=sys.stderr)
              print(source.read_text(errors='replace')[:2000], file=sys.stderr)
              raise SystemExit(20)

          data = payload.get('data') or {}
          urls = []
          if data.get('download'):
              urls.append(('base.apk', data['download']))
          for index, split in enumerate(data.get('split_apks') or [], 1):
              url = split.get('url')
              if url:
                  urls.append((f'split-{index:03d}.apk', url))

          summary = {
              'api_code': payload.get('code'),
              'api_message': payload.get('message'),
              'id': data.get('id'),
              'package_id': data.get('package_id'),
              'display_name': data.get('display_name'),
              'version_name': (data.get('apk') or {}).get('version_name'),
              'version_code': (data.get('apk') or {}).get('version_code'),
              'is_apk_ready': data.get('is_apk_ready'),
              'file_count': len(urls),
          }
          pathlib.Path('artifacts/qoopy-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))

          if data.get('package_id') not in (None, 'com.evermoregames.evermorearcade'):
              raise SystemExit(f'Unexpected package returned: {data.get("package_id")}')
          if not urls:
              raise SystemExit('QooApp entry has no downloadable APK files')

          with open('/tmp/evermore-urls.tsv', 'w') as out:
              for name, url in urls:
                  out.write(f'{name}\t{url}\n')
          PY

      - name: Download Evermore base and split APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36'
          : > artifacts/download-log.txt

          while IFS=$'\t' read -r name url; do
            [ -n "$name" ] && [ -n "$url" ] || continue
            echo "Downloading $name" | tee -a artifacts/download-log.txt
            curl --fail --show-error --location --retry 5 --retry-all-errors \
              --connect-timeout 45 --max-time 1800 \
              -A "$UA" -e 'https://m-apps.qoo-app.com/en-US/app/150473' \
              "$url" -o "/tmp/evermore-apks/$name"
            file "/tmp/evermore-apks/$name" | tee -a artifacts/download-log.txt
            test "$(head -c 2 "/tmp/evermore-apks/$name")" = 'PK'
            unzip -tq "/tmp/evermore-apks/$name" >/dev/null
          done < /tmp/evermore-urls.tsv

          find /tmp/evermore-apks -type f -iname '*.apk' -printf '%s %f\n' | sort -n | tee artifacts/downloaded-files.txt
          find /tmp/evermore-apks -type f -iname '*.apk' -print0 | xargs -0 sha256sum | tee artifacts/apk-sha256.txt
          APK_COUNT=$(find /tmp/evermore-apks -type f -iname '*.apk' | wc -l)
          [ "$APK_COUNT" -gt 0 ]
          echo "apk_count=$APK_COUNT" | tee artifacts/download-status.txt

      - name: Write emulator test script
        shell: bash
        run: |
          cat > run-evermore.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mkdir -p artifacts
          exec > >(tee artifacts/runner.log) 2>&1

          snapshot() {
            local name="$1"
            adb exec-out screencap -p > "artifacts/${name}.png" || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "artifacts/${name}.xml" >/dev/null 2>&1 || true
          }

          echo '=== Emulator identity ==='
          adb wait-for-device
          adb shell getprop > artifacts/getprop.txt
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abilist
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc wifi enable || true
          adb shell svc data enable || true

          mapfile -d '' APKS < <(find /tmp/evermore-apks -type f -iname '*.apk' -print0)
          echo "Installing ${#APKS[@]} APK file(s)"
          printf '%s\n' "${APKS[@]}" | tee artifacts/install-file-list.txt
          adb install-multiple -r -t -g "${APKS[@]}" | tee artifacts/install.txt

          echo '=== Package verification ==='
          adb shell pm path "$PKG" | tee artifacts/package-paths.txt
          adb shell dumpsys package "$PKG" > artifacts/package-dump.txt
          adb shell cmd package query-activities -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$REFERRAL_URL" > artifacts/deep-link-handlers-before.txt 2>&1 || true

          echo '=== First launch ==='
          adb logcat -c || true
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 | tee artifacts/first-launch.txt || true
          sleep 15
          snapshot 01-first-launch

          echo '=== Opening referral as an app-scoped deep link ==='
          adb shell am force-stop "$PKG" || true
          adb shell am start -W -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE \
            -d "$REFERRAL_URL" -p "$PKG" | tee artifacts/deep-link-app-scoped.txt || true
          sleep 10
          snapshot 02-referral-10s
          sleep 25
          snapshot 03-referral-35s

          echo '=== Opening referral through Android resolver as fallback ==='
          adb shell am start -W -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE \
            -d "$REFERRAL_URL" | tee artifacts/deep-link-generic.txt || true
          sleep 12
          snapshot 04-referral-generic

          adb shell dumpsys activity activities > artifacts/activities.txt || true
          adb shell dumpsys window windows > artifacts/windows.txt || true
          adb shell cmd package query-activities -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$REFERRAL_URL" > artifacts/deep-link-handlers-after.txt 2>&1 || true
          adb logcat -d -v threadtime > artifacts/logcat.txt || true

          TOP=$(adb shell dumpsys activity activities | sed -n 's/.*mResumedActivity:.* \([^ ]*\) .*/\1/p' | head -n1 | tr -d '\r')
          {
            echo "package=$PKG"
            echo "referral=$REFERRAL_URL"
            echo "installed=yes"
            echo "top_activity=$TOP"
            echo "android=$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "abilist=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
          } | tee artifacts/RESULT.txt
          SH
          chmod +x run-evermore.sh

      - name: Boot Android 12, install Evermore, and open referral
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          heap-size: 768M
          disk-size: 12288M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash run-evermore.sh

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evermore-referral-proof
          path: artifacts
          if-no-files-found: warn
          retention-days: 3
