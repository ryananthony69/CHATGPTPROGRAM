name: Evermore referral Android emulator

on:
  push:
    branches:
      - evermore-emulator-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-referral:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PKG: com.evermoregames.evermorearcade
      REFERRAL_URL: https://evermoregamesllc.com/referral?code=J32R6Q

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download Evermore from Google Play
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts /tmp/evermore-play
          python3 -m venv /tmp/gplaydl-venv
          /tmp/gplaydl-venv/bin/python -m pip install --disable-pip-version-check 'gplaydl==2.1.5'

          set +e
          /tmp/gplaydl-venv/bin/gplaydl auth --arch arm64 2>&1 | tee artifacts/gplay-auth.txt
          AUTH_RC=${PIPESTATUS[0]}
          /tmp/gplaydl-venv/bin/gplaydl info "$PKG" 2>&1 | tee artifacts/gplay-info.txt
          INFO_RC=${PIPESTATUS[0]}
          /tmp/gplaydl-venv/bin/gplaydl download "$PKG" -o /tmp/evermore-play -a arm64 2>&1 | tee artifacts/gplay-download.txt
          DOWNLOAD_RC=${PIPESTATUS[0]}
          set -e

          echo "auth_rc=$AUTH_RC info_rc=$INFO_RC download_rc=$DOWNLOAD_RC" | tee artifacts/download-status.txt
          find /tmp/evermore-play -maxdepth 3 -type f -printf '%s %p\n' | sort -n | tee artifacts/downloaded-files.txt

          APK_COUNT=$(find /tmp/evermore-play -type f -iname '*.apk' | wc -l)
          if [ "$DOWNLOAD_RC" -ne 0 ] || [ "$APK_COUNT" -eq 0 ]; then
            echo 'Direct Google Play download did not produce APK files; trying EFF apkeep via APKPure.' | tee -a artifacts/download-status.txt
            docker run --rm -v /tmp/evermore-play:/output ghcr.io/efforg/apkeep:stable \
              -a "$PKG" -d apk-pure /output 2>&1 | tee artifacts/apkeep-download.txt || true
            APK_COUNT=$(find /tmp/evermore-play -type f -iname '*.apk' | wc -l)
          fi

          if [ "$APK_COUNT" -eq 0 ]; then
            echo 'No Evermore APK files could be downloaded.' | tee artifacts/RESULT.txt
            exit 20
          fi

          echo "apk_count=$APK_COUNT" | tee -a artifacts/download-status.txt
          find /tmp/evermore-play -type f -iname '*.apk' -print0 | xargs -0 sha256sum | tee artifacts/apk-sha256.txt

      - name: Write emulator test script
        shell: bash
        run: |
          cat > run-evermore.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mkdir -p artifacts
          exec > >(tee artifacts/runner.log) 2>&1

          snapshot() {
            local name="$1"
            adb exec-out screencap -p > "artifacts/${name}.png" || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "artifacts/${name}.xml" >/dev/null 2>&1 || true
          }

          echo '=== Emulator identity ==='
          adb wait-for-device
          adb shell getprop > artifacts/getprop.txt
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abilist
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc wifi enable || true
          adb shell svc data enable || true

          mapfile -d '' APKS < <(find /tmp/evermore-play -type f -iname '*.apk' -print0)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo 'Download directory contained no APK files.' | tee artifacts/RESULT.txt
            exit 21
          fi

          echo "Installing ${#APKS[@]} APK file(s)"
          printf '%s\n' "${APKS[@]}" | tee artifacts/install-file-list.txt
          adb install-multiple -r -t -g "${APKS[@]}" | tee artifacts/install.txt

          while IFS= read -r -d '' obb; do
            adb shell mkdir -p "/sdcard/Android/obb/$PKG"
            adb push "$obb" "/sdcard/Android/obb/$PKG/"
          done < <(find /tmp/evermore-play -type f -iname '*.obb' -print0)

          echo '=== Package verification ==='
          adb shell pm path "$PKG" | tee artifacts/package-paths.txt
          adb shell dumpsys package "$PKG" > artifacts/package-dump.txt
          adb shell cmd package query-activities -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$REFERRAL_URL" > artifacts/deep-link-handlers-before.txt 2>&1 || true

          echo '=== First launch ==='
          adb logcat -c || true
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 | tee artifacts/first-launch.txt || true
          sleep 12
          snapshot 01-first-launch

          echo '=== Opening referral as an app-scoped deep link ==='
          adb shell am force-stop "$PKG" || true
          adb shell am start -W -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE \
            -d "$REFERRAL_URL" -p "$PKG" | tee artifacts/deep-link-app-scoped.txt || true
          sleep 8
          snapshot 02-referral-8s
          sleep 12
          snapshot 03-referral-20s

          echo '=== Opening referral through Android resolver as fallback ==='
          adb shell am start -W -a android.intent.action.VIEW \
            -c android.intent.category.BROWSABLE \
            -d "$REFERRAL_URL" | tee artifacts/deep-link-generic.txt || true
          sleep 10
          snapshot 04-referral-generic

          adb shell dumpsys activity activities > artifacts/activities.txt || true
          adb shell dumpsys window windows > artifacts/windows.txt || true
          adb shell cmd package query-activities -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$REFERRAL_URL" > artifacts/deep-link-handlers-after.txt 2>&1 || true
          adb logcat -d -v threadtime > artifacts/logcat.txt || true

          TOP=$(adb shell dumpsys activity activities | sed -n 's/.*mResumedActivity:.* \([^ ]*\) .*/\1/p' | head -n1 | tr -d '\r')
          {
            echo "package=$PKG"
            echo "referral=$REFERRAL_URL"
            echo "installed=yes"
            echo "top_activity=$TOP"
            echo "android=$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "abilist=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
          } | tee artifacts/RESULT.txt
          SH
          chmod +x run-evermore.sh

      - name: Boot Android 12, install Evermore, and open referral
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash run-evermore.sh

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evermore-referral-proof
          path: artifacts
          if-no-files-found: warn
          retention-days: 3
