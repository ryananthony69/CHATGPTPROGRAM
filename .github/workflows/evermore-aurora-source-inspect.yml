name: Evermore Aurora source inspection

on:
  pull_request:
    branches:
      - evermore-windows-20260806

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect current Aurora Store anonymous/download implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          git clone --depth 1 https://gitlab.com/AuroraOSS/AuroraStore.git aurora
          cd aurora
          git rev-parse HEAD | tee ../artifacts/aurora-head.txt
          git log -1 --format='%H%n%ci%n%s' | tee ../artifacts/aurora-commit.txt
          find . -maxdepth 4 -type f | sort > ../artifacts/file-list.txt
          printf '%s\n' '=== dependency/build references ===' > ../artifacts/aurora-grep.txt
          grep -RniE --include='*.kt' --include='*.java' --include='*.xml' --include='*.gradle' --include='*.kts' --include='*.toml' \
            'gplayapi|auroraoss\.com|api/auth|amiblocked|anonymous|web.?api|download' . \
            >> ../artifacts/aurora-grep.txt || true
          printf '%s\n' '=== files mentioning likely API classes ===' > ../artifacts/matching-files.txt
          grep -RliE --include='*.kt' --include='*.java' --include='*.gradle' --include='*.kts' --include='*.toml' \
            'gplayapi|auroraoss\.com|api/auth|anonymous|web.?api|download' . \
            | sort >> ../artifacts/matching-files.txt || true
          mkdir -p ../artifacts/source
          tail -n +2 ../artifacts/matching-files.txt | while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              *Auth*|*Api*|*API*|*Download*|*Provider*|*Repository*|*build.gradle*|*libs.versions.toml)
                clean="${f#./}"
                mkdir -p "../artifacts/source/$(dirname "$clean")"
                cp "$f" "../artifacts/source/$clean" || true
                ;;
            esac
          done
          cd ..
          find artifacts/source -type f -print | sort | tee artifacts/copied-files.txt

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evermore-aurora-source-inspection
          path: artifacts
          retention-days: 3
