name: Android runtime relay native

on:
  push:
    branches:
      - android-runtime-relay-20260806
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay-runtime:
    runs-on: ubuntu-slim
    timeout-minutes: 14
    steps:
      - name: Resolve and download official Android runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p runtime diagnostics
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'AndroidSDKManager/1.0'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read()

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          def child_text(node, name, default=''):
              for child in node.iter():
                  if local(child.tag) == name and child.text:
                      return child.text.strip()
              return default

          def revision(pkg):
              rev = next((x for x in pkg if local(x.tag) == 'revision'), None)
              vals = {}
              if rev is not None:
                  for item in rev:
                      try:
                          vals[local(item.tag)] = int((item.text or '0').strip())
                      except ValueError:
                          vals[local(item.tag)] = 0
              return (vals.get('major', 0), vals.get('minor', 0),
                      vals.get('micro', 0), vals.get('preview', 0))

          def channel(pkg):
              for child in pkg:
                  if local(child.tag) == 'channelRef':
                      return child.attrib.get('ref', '')
              return 'channel-0'

          def archives(pkg, wanted_os=None, wanted_arch=None):
              output = []
              for archive in pkg.iter():
                  if local(archive.tag) != 'archive':
                      continue
                  host_os = child_text(archive, 'host-os')
                  host_arch = child_text(archive, 'host-arch')
                  if wanted_os and host_os and host_os != wanted_os:
                      continue
                  if wanted_arch and host_arch and host_arch != wanted_arch:
                      continue
                  complete = next((x for x in archive.iter() if local(x.tag) == 'complete'), None)
                  if complete is None:
                      continue
                  url = child_text(complete, 'url')
                  if url:
                      output.append({'url': url, 'size': child_text(complete, 'size'),
                                     'checksum': child_text(complete, 'checksum'),
                                     'host_os': host_os, 'host_arch': host_arch})
              return output

          repo_bytes = fetch('https://dl.google.com/android/repository/repository2-3.xml')
          sys_bytes = fetch('https://dl.google.com/android/repository/sys-img/google_apis/sys-img2-3.xml')
          repo_root = ET.fromstring(repo_bytes)
          sys_root = ET.fromstring(sys_bytes)

          emulators = []
          for pkg in repo_root.iter():
              if local(pkg.tag) == 'remotePackage' and pkg.attrib.get('path') == 'emulator' \
                      and channel(pkg) in ('', 'channel-0'):
                  for archive in archives(pkg, 'linux', 'x86_64'):
                      emulators.append((revision(pkg), archive))
          if not emulators:
              raise SystemExit('No stable Linux x86_64 emulator archive found')
          emu_rev, emu = max(emulators, key=lambda item: item[0])

          package = 'system-images;android-31;google_apis;x86_64'
          images = []
          for pkg in sys_root.iter():
              if local(pkg.tag) == 'remotePackage' and pkg.attrib.get('path') == package \
                      and channel(pkg) in ('', 'channel-0'):
                  for archive in archives(pkg):
                      images.append((revision(pkg), archive))
          if not images:
              raise SystemExit('No stable API 31 Google APIs x86_64 image found')
          image_rev, image = max(images, key=lambda item: item[0])

          manifest = {
              'emulator': {'revision': emu_rev, **emu,
                           'absolute_url': 'https://dl.google.com/android/repository/' + emu['url']},
              'system_image': {'package': package, 'revision': image_rev, **image,
                               'absolute_url': 'https://dl.google.com/android/repository/sys-img/google_apis/' + image['url']},
              'platform_tools': {'absolute_url': 'https://dl.google.com/android/repository/platform-tools-latest-linux.zip'},
          }
          Path('diagnostics/manifest.json').write_text(json.dumps(manifest, indent=2))
          Path('/tmp/emulator-url').write_text(manifest['emulator']['absolute_url'])
          Path('/tmp/system-image-url').write_text(manifest['system_image']['absolute_url'])
          print(json.dumps(manifest, indent=2))
          PY

          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 --max-time 480 \
            "$(cat /tmp/emulator-url)" -o runtime/emulator-linux-x64.zip
          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 --max-time 300 \
            https://dl.google.com/android/repository/platform-tools-latest-linux.zip \
            -o runtime/platform-tools-linux.zip
          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "$(cat /tmp/system-image-url)" -o runtime/google-apis-x86_64-android-31.zip

          for archive in runtime/*.zip; do
            test "$(head -c 2 "$archive")" = 'PK'
            unzip -tq "$archive" >/dev/null
          done
          sha256sum runtime/*.zip | tee diagnostics/sha256.txt
          du -h runtime/*.zip | tee diagnostics/sizes.txt

      - name: Publish staged runtime without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="android-runtime-${GITHUB_RUN_ID}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          python3 - <<PY > /tmp/release.json
          import json
          print(json.dumps({
              'tag_name': '${TAG}',
              'target_commitish': '${GITHUB_SHA}',
              'name': 'Temporary Android runtime relay ${GITHUB_RUN_ID}',
              'body': 'Official Android emulator, platform tools, and API 31 Google APIs x86_64 image for the isolated Evermore test.',
              'draft': True,
              'prerelease': True,
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/releases" --data-binary @/tmp/release.json \
            | tee /tmp/release-response.json
          UPLOAD=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/release-response.json'))['upload_url'].split('{',1)[0])
          PY
          )
          for file in runtime/*.zip diagnostics/manifest.json diagnostics/sha256.txt diagnostics/sizes.txt; do
            name=$(basename "$file")
            type=application/octet-stream
            case "$name" in *.zip) type=application/zip;; *.json) type=application/json;; *.txt) type=text/plain;; esac
            echo "uploading=$name size=$(stat -c %s "$file")"
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $type" \
              --data-binary @"$file" "${UPLOAD}?name=${name}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("asset_id=%s name=%s size=%s"%(d["id"],d["name"],d["size"]))'
          done
