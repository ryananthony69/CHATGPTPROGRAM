name: Android runtime relay native

on:
  push:
    branches:
      - android-runtime-relay-20260806
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay-runtime:
    runs-on: ubuntu-slim
    timeout-minutes: 14
    env:
      EMULATOR_URL: https://dl.google.com/android/repository/emulator-linux_x64-13023280.zip
      PLATFORM_TOOLS_URL: https://dl.google.com/android/repository/platform-tools-latest-linux.zip
      SYSTEM_IMAGE_URL: https://dl.google.com/android/repository/sys-img/google_apis/x86_64-31_r14.zip
    steps:
      - name: Download and validate official Android runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p runtime diagnostics
          printf '%s\n' \
            "emulator=$EMULATOR_URL" \
            "platform_tools=$PLATFORM_TOOLS_URL" \
            "system_image=$SYSTEM_IMAGE_URL" \
            | tee diagnostics/urls.txt

          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --max-time 420 \
            "$EMULATOR_URL" -o runtime/emulator-linux-x64.zip
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --max-time 240 \
            "$PLATFORM_TOOLS_URL" -o runtime/platform-tools-linux.zip
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 30 --max-time 480 \
            "$SYSTEM_IMAGE_URL" -o runtime/google-apis-x86_64-android-31.zip

          for archive in runtime/*.zip; do
            test "$(head -c 2 "$archive")" = 'PK'
            unzip -tq "$archive" >/dev/null
          done
          sha256sum runtime/*.zip | tee diagnostics/sha256.txt
          du -h runtime/*.zip | tee diagnostics/sizes.txt

      - name: Publish staged runtime without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="android-runtime-${GITHUB_RUN_ID}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          python3 - <<PY > /tmp/release.json
          import json
          print(json.dumps({
              'tag_name': '${TAG}',
              'target_commitish': '${GITHUB_SHA}',
              'name': 'Temporary Android runtime relay ${GITHUB_RUN_ID}',
              'body': 'Official Android emulator, platform tools, and Android 12 Google APIs x86_64 image for the isolated Evermore test.',
              'draft': True,
              'prerelease': True,
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/releases" --data-binary @/tmp/release.json \
            | tee /tmp/release-response.json
          UPLOAD=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/release-response.json'))['upload_url'].split('{',1)[0])
          PY
          )
          for file in runtime/*.zip diagnostics/urls.txt diagnostics/sha256.txt diagnostics/sizes.txt; do
            name=$(basename "$file")
            type=application/octet-stream
            case "$name" in *.zip) type=application/zip;; *.txt) type=text/plain;; esac
            echo "uploading=$name size=$(stat -c %s "$file")"
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $type" \
              --data-binary @"$file" "${UPLOAD}?name=${name}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("asset_id=%s name=%s size=%s"%(d["id"],d["name"],d["size"]))'
          done
